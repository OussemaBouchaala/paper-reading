<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paperwalk: guided paper reading</title>
<meta name="description" content="Read research papers the easy way: narrated explainer videos, animated diagrams, replayable examples, quick checks and a glossary.">
<meta name="theme-color" content="#07090d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="top">
  <a class="brand" href="#start" aria-label="Paperwalk home">
    <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><circle cx="16" cy="6" r="4" fill="var(--thought)"/><circle cx="26" cy="23" r="4" fill="var(--act)"/><circle cx="6" cy="23" r="4" fill="var(--obs)"/><path d="M19 8l5 11M23 25H9M8 19l5-11" stroke="currentColor" stroke-width="1.6" fill="none" opacity=".5"/></svg>
    <span>Paperwalk</span>
  </a>
  <div class="meter" aria-label="Reading progress"><div class="meter-bar"><i id="pbar"></i></div><span id="ptext">0%</span></div>
  <div class="tools">
    <span class="xp" id="xp" title="5 points per step, 15 per check right first time">0 pts</span>
    <button class="kbtn" id="cmdBtn" aria-haspopup="dialog"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Search</span><kbd>Ctrl K</kbd></button>
  </div>
</header>

<main id="app" aria-live="polite"><p class="loading">Loading paper…</p></main>

<div id="cmd" class="cmd" role="dialog" aria-modal="true" aria-label="Search the paper" hidden>
  <div class="cmd-in">
    <input id="cmdInput" type="search" placeholder="Jump to a section, or look up a term…" aria-label="Search" autocomplete="off">
    <ul id="cmdList" role="listbox"></ul>
    <div class="cmd-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
  </div>
</div>
<div id="pop" class="pop" role="tooltip" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<canvas id="fx" class="fx" aria-hidden="true"></canvas>

<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/vendor/DrawSVGPlugin.min.js"></script>
<script src="assets/vendor/MotionPathPlugin.min.js"></script>
<script src="assets/vendor/ScrollTrigger.min.js"></script>
<script src="assets/explainer.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
