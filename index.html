<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paperwalk: guided paper reading</title>
<meta name="description" content="Read research papers step by step: narrated motion films, living diagrams, replayable examples, quick checks and a glossary.">
<meta name="theme-color" content="#07070c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f4fa" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2307070c'/%3E%3Ccircle cx='16' cy='9' r='4' fill='%235eead4'/%3E%3Ccircle cx='24' cy='22' r='4' fill='%23fb7185'/%3E%3Ccircle cx='8' cy='22' r='4' fill='%23fbbf24'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script>try{const t=localStorage.getItem('pw-theme');if(t)document.documentElement.dataset.theme=t}catch{}</script>
</head>
<body>
<div class="sky" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><div class="grid"></div><div class="grain"></div></div>
<div class="glow" aria-hidden="true"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--think)"/><stop offset="1" stop-color="var(--accent)"/></linearGradient></defs></svg>

<header class="top">
  <nav class="navbar">
    <a class="brand" href="#start" aria-label="Paperwalk home">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><circle cx="16" cy="8.5" r="4.2" fill="var(--think)"/><circle cx="24.5" cy="22" r="4.2" fill="var(--act)"/><circle cx="7.5" cy="22" r="4.2" fill="var(--obs)"/><path d="M19.6 11.6l3 6.2M20 23.6h-8M9.6 17.8l3-6.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity=".55"/></svg>
      <span>Paperwalk</span>
    </a>
    <div class="meter" aria-label="Reading progress"><div class="meter-bar"><i id="pbar"></i></div><span id="ptext">0%</span></div>
    <div class="tools">
      <span class="xp" id="xp" title="Points: 5 per step read, 15 per check right first time">0 pts</span>
      <button class="chip" id="cmdBtn" aria-haspopup="dialog" aria-label="Search (Ctrl K)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><span>Search</span><kbd>⌘K</kbd></button>
      <button class="chip icon" id="glossBtn" aria-haspopup="dialog" aria-label="Glossary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h10.5a3 3 0 013 3V20H8a3 3 0 01-3-3z"/><path d="M5 17a3 3 0 013-3h10.5"/></svg></button>
      <button class="chip icon" id="themeBtn" aria-label="Switch light or dark theme"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></button>
    </div>
  </nav>
</header>

<main id="app" aria-live="polite"><p class="loading">Loading paper…</p></main>

<div id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="glossTitle" hidden>
  <div class="drawer-in">
    <div class="drawer-head"><h2 id="glossTitle">Glossary</h2><button class="chip" id="glossClose" aria-label="Close glossary">Close</button></div>
    <input id="glossSearch" type="search" placeholder="Search terms" aria-label="Search glossary">
    <dl id="glossList"></dl>
  </div>
</div>

<div id="cmd" class="cmd" role="dialog" aria-modal="true" aria-label="Search the paper" hidden>
  <div class="cmd-in">
    <div class="cmd-q"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><input id="cmdInput" type="search" placeholder="Jump to a stop, a step, a term…" aria-label="Search" autocomplete="off"><kbd>Esc</kbd></div>
    <ul id="cmdList" role="listbox"></ul>
  </div>
</div>
<div id="pop" class="pop" role="tooltip" hidden></div>

<script src="assets/film.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
